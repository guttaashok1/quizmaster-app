name: deploy-interview-coach

# Auto-deploys the Interview Coach backend + web app (server/) to Vercel on every
# push to main. This mirrors the manual `cd server && vercel --prod` flow.
#
# Why a GitHub Action instead of Vercel's native Git integration:
#   This is a monorepo — the Expo app lives at the repo root and the deployable
#   app is in server/. The Vercel project's Root Directory is "." , so native
#   Git builds would build the wrong directory. Running the Vercel CLI scoped to
#   server/ from CI avoids that entirely.
#
# REQUIRED GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       — create at vercel.com/account/tokens (scope: Gayathri's projects)
#   VERCEL_ORG_ID      — team_Kaxc0B3zkNCRCPy82LVgGUS3
#   VERCEL_PROJECT_ID  — prj_lk8AHXYhnwIXZYxQTVyRtA6TdNbP
# Until all three exist, this workflow will fail fast (that's expected).

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:   # manual "Run workflow" button in the Actions tab

concurrency:
  group: deploy-interview-coach
  cancel-in-progress: true   # newer push supersedes an in-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (prebuilt output)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
