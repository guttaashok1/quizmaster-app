<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners (maskable safe zone: centre 80%) -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Inner glow circle -->
  <circle cx="256" cy="220" r="170" fill="rgba(255,255,255,0.06)"/>

  <!-- Microphone capsule body -->
  <rect x="196" y="108" width="120" height="180" rx="60" fill="url(#mic)"/>

  <!-- Stand arc -->
  <path d="M176 268 Q176 358 256 358 Q336 358 336 268"
        stroke="white" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- Stem -->
  <line x1="256" y1="358" x2="256" y2="404"
        stroke="white" stroke-width="22" stroke-linecap="round"/>

  <!-- Base bar -->
  <line x1="206" y1="404" x2="306" y2="404"
        stroke="white" stroke-width="22" stroke-linecap="round"/>
</svg>
